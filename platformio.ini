[env:nanoatmega328]
platform = atmelavr
board = nanoatmega328
framework = arduino
upload_speed = 57600

build_flags =
    !printf -- '-DSOURCE_VERSION=\\\"%%s.%%s\\\"' "$(git rev-list HEAD --count)" "$(git describe --match='' --always --dirty='+')"

lib_deps =
    https://github.com/pu2clr/SI4735            @ 2.1.8
    https://github.com/datacute/Tiny4kOLED      @ 2.3.0
    https://github.com/datacute/TinyOLED-Fonts  @ 1.2.0
